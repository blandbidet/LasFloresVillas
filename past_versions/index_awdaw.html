<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Las Flores Villas — St. John, USVI</title>
<meta name="description" content="Four family-owned villas on the hills of St. John, USVI — private pools, ocean views, and walking distance to Cruz Bay. Hawksbill, Jasmine, Periwinkle & Rosebay.">
<meta property="og:title" content="Las Flores Villas — St. John, USVI">
<meta property="og:description" content="Four family-owned villas on the hills of St. John, USVI — private pools, ocean views, and walking distance to Cruz Bay.">
<meta property="og:image" content="slide_photos/1.jpg">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌺</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>

:root {
  --cream:#EBEBEB;
  --cream2:#F5F5F5;
  --bd:#21252C;
  --bm:#1C3EA4;
  --bl:#1C3EA4;
  --teal:#1C3EA4;
  --bm-dk:#16307D;
  --sand:#DADADA;
  --sandl:#DBDBDB;
  --white:#fff;
  --tx:#21252C;
  --txm:#4A4F58;
  --txl:#6E747E;
  --fs:'Cormorant Garamond',Georgia,serif; --fb:'Jost',system-ui,sans-serif;
  --nh:72px; --r:2px; --t:.3s ease;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--fb);background:var(--cream);color:var(--tx);overflow-x:hidden}
a{text-decoration:none;color:inherit}
img{display:block;max-width:100%}
button{font-family:var(--fb);cursor:pointer;border:none}
.vc:focus-visible,.vsnt:focus-visible,.ovi:focus-visible,.flist li:focus-visible{
  outline:2px solid var(--bm);outline-offset:2px}

#nav{position:fixed;top:0;left:0;right:0;z-index:999;height:var(--nh);
  display:flex;align-items:center;justify-content:space-between;padding:0 40px;
  transition:background var(--t),box-shadow var(--t)}
#nav.glass{background:transparent}
#nav.solid{background:var(--cream2);box-shadow:0 1px 24px rgba(33,37,44,.08)}
.nb{cursor:pointer;display:flex;flex-direction:column;gap:2px}
.nb-name{font-family:var(--fs);font-size:1.55rem;font-weight:500;color:var(--bd);line-height:1;transition:color var(--t)}
.nb-sub{font-size:.6rem;font-weight:400;letter-spacing:.22em;text-transform:uppercase;color:var(--txl);transition:color var(--t)}
.nav-light .nb-name{color:#fff}
.nav-light .nb-sub{color:rgba(255,255,255,.65)}
.nl{display:flex;align-items:center;gap:3px;list-style:none}
.nl a{display:block;padding:8px 13px;font-size:.7rem;font-weight:500;letter-spacing:.12em;
  text-transform:uppercase;color:var(--bd);border-radius:var(--r);
  transition:color var(--t),background var(--t);cursor:pointer}
.nav-light .nl a{color:rgba(255,255,255,.88)}
.nl a:hover{color:var(--bm);background:rgba(28,62,164,.07)}
.nav-light .nl a:hover{color:#fff;background:rgba(255,255,255,.12)}

#app{animation:pgIn .38s ease both}
@keyframes pgIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.hero{position:relative;height:100svh;min-height:580px;overflow:hidden;
  display:flex;align-items:center;justify-content:center}
.hslide{position:absolute;inset:0;background-size:cover;background-position:center;
  opacity:0;transition:opacity 1.4s ease}
.hslide.on{opacity:1}
.hovl{position:absolute;inset:0;
  background:linear-gradient(155deg,rgba(0,0,0,.08) 0%,rgba(0,0,0,.38) 55%,rgba(0,0,0,.58) 100%)}
.hcont{position:relative;z-index:2;text-align:center;color:#fff;padding:0 20px;
  animation:heroIn 1.1s .2s ease both}
@keyframes heroIn{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.hey{font-size:.68rem;font-weight:400;letter-spacing:.36em;text-transform:uppercase;
  opacity:.82;margin-bottom:20px}
.htitle{font-family:var(--fs);font-size:clamp(4rem,10vw,8rem);font-weight:300;
  line-height:.95;margin-bottom:4px}
.hsub{font-family:var(--fs);font-size:clamp(1.5rem,3.5vw,2.6rem);font-weight:300;
  font-style:italic;opacity:.96;margin-bottom:46px}
.hbtns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.bw{background:#fff;color:var(--bd);padding:14px 42px;
  font-size:.7rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
  transition:all var(--t)}
.bw:hover{background:var(--sandl)}
.hdots{position:absolute;bottom:28px;right:36px;z-index:2;display:flex;gap:8px}
.hdot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35);
  cursor:pointer;transition:all var(--t)}
.hdot.on{background:#fff;transform:scale(1.25)}

.section-eyebrow{font-size:.66rem;font-weight:500;letter-spacing:.3em;
  text-transform:uppercase;color:var(--bl);display:block;margin-bottom:12px}
.section-title{font-family:var(--fs);font-size:clamp(1.9rem,4vw,2.9rem);
  font-weight:400;color:var(--bd)}
.mxw{max-width:1200px;margin:0 auto}
.pad{padding:0 40px}

.intro-grid{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center;
  max-width:1200px;margin:0 auto;padding:96px 40px}
.intro-grid img{width:100%;aspect-ratio:4/3;object-fit:cover}
.intro-eybrow{margin-bottom:14px}
.intro-grid h2{font-family:var(--fs);font-size:clamp(1.9rem,3.5vw,2.8rem);font-weight:400;
  color:var(--bd);line-height:1.2;margin-top:14px;margin-bottom:18px}
.intro-grid p{font-size:.93rem;line-height:1.95;color:var(--txm);margin-bottom:28px}
.feat-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px}
.feat{font-size:.8rem;color:var(--txl);display:flex;align-items:center;gap:8px;padding:5px 0}
.feat::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--bl);flex-shrink:0}

.vcards-wrap{max-width:1200px;margin:0 auto;padding:0 40px 96px}
.vcards{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;
  background:var(--sandl);border:1px solid var(--sandl)}
.vc{background:var(--cream2);cursor:pointer;overflow:hidden;
  transition:box-shadow var(--t),transform var(--t);position:relative}
.vc:hover{box-shadow:0 12px 50px rgba(33,37,44,.14);z-index:1}
.vc-img{overflow:hidden}
.vc img{width:100%;aspect-ratio:3/2;object-fit:cover;transition:transform .7s ease}
.vc:hover img{transform:scale(1.06)}
.vc-body{padding:20px 22px 24px}
.vc-name{font-family:var(--fs);font-size:1.5rem;font-weight:500;color:var(--bd);margin-bottom:5px}
.vc-stats{font-size:.73rem;color:var(--txl);letter-spacing:.04em;margin-bottom:12px}
.vc-price{font-family:var(--fs);font-size:1.1rem;color:var(--bm);margin-bottom:13px}
.vc-price small{font-family:var(--fb);font-size:.7rem;color:var(--txl)}
.vc-link{font-size:.67rem;font-weight:600;letter-spacing:.17em;text-transform:uppercase;
  color:var(--bd);border-bottom:1px solid var(--bd);padding-bottom:2px;display:inline-block;
  transition:color var(--t),border-color var(--t)}
.vc:hover .vc-link{color:var(--bm);border-color:var(--bm)}

.stjohn{padding:96px 40px;background:var(--cream2)}
.sj-inner{max-width:1200px;margin:0 auto;display:grid;
  grid-template-columns:1fr 1fr;gap:80px;align-items:start}
.sj-img-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sj-img-grid img{width:100%;object-fit:cover}
.sj-img-grid img:first-child{grid-column:span 2;aspect-ratio:16/7}
.sj-img-grid img:not(:first-child){aspect-ratio:4/3}
.sj-text h2{font-family:var(--fs);font-size:clamp(1.8rem,3.5vw,2.6rem);font-weight:400;
  color:var(--bd);margin:12px 0 14px}
.sj-text p{font-size:.9rem;line-height:1.95;color:var(--txm);margin-bottom:26px}
.sj-list{list-style:none}
.sj-list li{display:flex;gap:14px;align-items:flex-start;padding:14px 0;
  border-bottom:1px solid var(--sandl)}
.sj-icon{width:32px;height:32px;border-radius:50%;background:var(--sandl);
  display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;margin-top:1px}
.sj-li-t{font-size:.83rem;font-weight:500;color:var(--bd);display:block;margin-bottom:2px}
.sj-li-s{font-size:.78rem;color:var(--txl)}

.offers-wrap{padding:96px 40px;background:var(--bd)}
.offers-wrap .section-title{color:#fff}
.offers-wrap .section-eyebrow{color:rgba(255,255,255,.55)}
.offers-inner{max-width:1200px;margin:0 auto}
.offers-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:44px}
.ocard{background:var(--cream);overflow:hidden}
.ocard img{width:100%;aspect-ratio:16/9;object-fit:cover}
.ocard-body{padding:24px 26px 28px}
.ocard-body h3{font-family:var(--fs);font-size:1.35rem;color:var(--bd);margin-bottom:9px}
.ocard-body p{font-size:.83rem;line-height:1.8;color:var(--txl)}

.reviews-wrap{padding:96px 40px;position:relative;
  background:linear-gradient(rgba(33,37,44,.5),rgba(33,37,44,.5)),
  url('slide_photos/1.jpg');
  background-size:cover;background-position:center;background-attachment:fixed}
@media(max-width:900px){
  .reviews-wrap{background-attachment:scroll}
}
.reviews-inner{max-width:1200px;margin:0 auto}
.reviews-inner .section-eyebrow{color:rgba(255,255,255,.45)}
.reviews-inner .section-title{color:#fff;margin-bottom:44px}
.rg{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.rcard{display:block;padding:30px 28px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);transition:background var(--t),border-color var(--t)}
a.rcard:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.28)}

.rqs{font-family:var(--fs);font-size:3.2rem;line-height:1;color:rgba(255,255,255,.55);margin-bottom:8px}
.rstars{color:rgba(255,255,255,.75);font-size:.73rem;letter-spacing:3px;margin-bottom:10px}
.rtxt{font-size:.9rem;line-height:1.85;color:rgba(255,255,255,.8);font-style:italic;margin-bottom:15px}
.rvilla{font-size:.67rem;color:rgba(255,255,255,.33);margin-top:3px}
.rsrc{margin-top:40px;text-align:center}
.rsrc a{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(255,255,255,.45);border-bottom:1px solid rgba(255,255,255,.28);
  padding-bottom:2px;cursor:pointer}

footer{background:var(--cream2);border-top:1px solid var(--sand);padding:64px 40px 32px}
.fg{max-width:1200px;margin:0 auto;display:grid;
  grid-template-columns:2fr 1fr;gap:40px}
.fbn{font-family:var(--fs);font-size:1.65rem;font-weight:500;color:var(--bd);margin-bottom:11px}
.ftag{font-size:.83rem;line-height:1.75;color:var(--txl);line-height:1.75;margin-bottom:18px}
.fcon p{font-size:.8rem;color:var(--txm);margin-bottom:5px}
.fct{font-size:.63rem;font-weight:600;letter-spacing:.24em;text-transform:uppercase;
  color:var(--bd);margin-bottom:14px}
.flist{list-style:none}
.flist li{font-size:.82rem;color:var(--txl);padding:5px 0;
  cursor:pointer;transition:color var(--t)}
.flist li:hover{color:var(--bd)}
.flist.no-hover li{cursor:default}
.flist.no-hover li:hover{color:var(--txl)}
.fbot{max-width:1200px;margin:36px auto 0;padding-top:22px;
  border-top:1px solid var(--sand);display:flex;justify-content:space-between;
  font-size:.73rem;color:var(--txl)}

.vhero{height:18vh;min-height:175px;position:relative;
  display:flex;align-items:flex-end;overflow:hidden}
.vhero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vhovl{position:absolute;inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.68) 0%,rgba(0,0,0,.05) 55%)}
.vhcont{position:relative;z-index:2;padding:0 40px 30px;width:100%}
.vname{font-family:var(--fs);font-size:clamp(2.8rem,7vw,5rem);font-weight:300;
  color:#fff;margin-bottom:12px}
.vtags{display:flex;gap:9px;flex-wrap:wrap}
.vtag{background:rgba(255,255,255,.18);color:#fff;padding:5px 13px;
  font-size:.68rem;letter-spacing:.1em;backdrop-filter:blur(6px)}
.vsubnav{background:var(--cream2);border-bottom:1px solid var(--sand);
  padding:0 40px;position:sticky;top:var(--nh);z-index:90;
  display:flex;gap:0;overflow-x:auto}
.vsnt{padding:16px 18px;font-size:.7rem;font-weight:500;letter-spacing:.1em;
  text-transform:uppercase;color:var(--txl);cursor:pointer;white-space:nowrap;
  border-bottom:2px solid transparent;transition:all var(--t)}
.vsnt:hover{color:var(--bd);border-bottom-color:var(--sand)}
.vmain{max-width:1200px;margin:0 auto;padding:40px 40px 60px}
.v2col{display:grid;grid-template-columns:1fr 360px;gap:60px;align-items:start}

.vshow{position:relative;margin-bottom:12px;background:var(--bd);
  border:1px solid var(--sand);border-radius:var(--r);overflow:hidden;
  outline:none}
.vshow-stage{position:relative;aspect-ratio:1.9/1;background:var(--bd);cursor:zoom-in}
.vshow-slide{position:absolute;inset:0;opacity:0;transition:opacity .8s ease}
.vshow-slide.on{opacity:1}
.vshow-slide img{width:100%;height:100%;object-fit:cover}
.vshow-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:3;
  width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.86);
  color:var(--bd);font-family:var(--fs);font-size:1.7rem;line-height:1;
  display:flex;align-items:center;justify-content:center;padding-bottom:3px;
  box-shadow:0 2px 16px rgba(0,0,0,.28);transition:background var(--t),transform var(--t)}
.vshow-arrow:hover{background:#fff;transform:translateY(-50%) scale(1.08)}
.vshow-prev{left:14px}
.vshow-next{right:14px}
.vshow-counter{position:absolute;top:14px;right:16px;z-index:3;
  background:rgba(0,0,0,.5);color:#fff;font-size:.72rem;letter-spacing:.08em;
  padding:5px 11px;border-radius:20px;backdrop-filter:blur(4px)}
.vshow-dots{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  z-index:3;display:flex;gap:8px}
.vshow-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.42);
  cursor:pointer;padding:0;transition:background var(--t),transform var(--t)}
.vshow-dot.on{background:#fff;transform:scale(1.3)}
.vshow.single .vshow-arrow,.vshow.single .vshow-dots,.vshow.single .vshow-counter{display:none}

.vshow.single{margin-bottom:52px}
.vshow-thumbs{display:flex;gap:6px;margin-bottom:52px;overflow-x:auto;
  padding-bottom:8px;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.vshow.single + .vshow-thumbs{display:none}
.vshow-thumbs::-webkit-scrollbar{height:6px}
.vshow-thumbs::-webkit-scrollbar-thumb{background:var(--sand);border-radius:3px}
.vshow-thumbs::-webkit-scrollbar-track{background:transparent}
.vthumb{flex:0 0 auto;width:46px;height:32px;padding:0;border:2px solid transparent;
  border-radius:2px;overflow:hidden;cursor:pointer;background:var(--bd);opacity:.5;
  transition:opacity var(--t),border-color var(--t)}
.vthumb img{width:100%;height:100%;object-fit:cover;display:block}
.vthumb:hover{opacity:.85}
.vthumb.on{opacity:1;border-color:var(--bm)}

.vlb{position:fixed;inset:0;z-index:2000;display:none;align-items:center;
  justify-content:center;background:rgba(33,37,44,.86);backdrop-filter:blur(3px);
  padding:5vh 5vw;cursor:zoom-out}
.vlb.open{display:flex;animation:vlbIn .22s ease}
@keyframes vlbIn{from{opacity:0}to{opacity:1}}
.vlb-fig{position:relative;margin:0;display:flex;flex-direction:column;
  align-items:center;max-width:90vw;max-height:88vh}
.vlb-img{max-width:90vw;max-height:80vh;width:auto;height:auto;object-fit:contain;
  cursor:default;background:var(--bd);border-radius:2px;
  box-shadow:0 24px 90px rgba(0,0,0,.6)}
.vlb-cap{margin-top:12px;color:rgba(255,255,255,.68);font-size:.76rem;letter-spacing:.1em}
.vlb-close{position:absolute;top:18px;right:22px;z-index:3;width:44px;height:44px;
  border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:1.9rem;
  line-height:1;display:flex;align-items:center;justify-content:center;
  padding-bottom:3px;transition:background var(--t)}
.vlb-close:hover{background:rgba(255,255,255,.3)}
.vlb-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:50px;
  height:50px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;
  font-family:var(--fs);font-size:2rem;line-height:1;display:flex;align-items:center;
  justify-content:center;padding-bottom:4px;transition:background var(--t),transform var(--t)}
.vlb-arrow:hover{background:rgba(255,255,255,.3);transform:translateY(-50%) scale(1.06)}
.vlb-prev{left:20px}.vlb-next{right:20px}
.vlb.single .vlb-arrow{display:none}
@media(max-width:600px){
  .vlb-arrow{width:42px;height:42px;font-size:1.6rem}
  .vlb-prev{left:8px}.vlb-next{right:8px}
  .vlb-img{max-height:74vh}
}
.vsec{margin-bottom:50px}
.vsec h3{font-family:var(--fs);font-size:1.5rem;font-weight:400;color:var(--bd);
  margin-bottom:14px;padding-bottom:11px;border-bottom:1px solid var(--sand)}
.vdesc{font-size:.91rem;line-height:1.95;color:var(--txm)}
.amen-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
.amen{display:flex;align-items:center;gap:8px;padding:8px 0;
  border-bottom:1px solid var(--sandl);font-size:.82rem;color:var(--txm)}
.amen::before{content:'✓';color:var(--bl);font-size:.72rem;flex-shrink:0}
.dist-row{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.dc{background:var(--cream2);border:1px solid var(--sand);
  padding:16px 14px;text-align:center}
.dc .di{font-size:1.4rem;margin-bottom:7px}
.dc .dn{font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--txl);margin-bottom:4px}
.dc .dv{font-family:var(--fs);font-size:1.05rem;color:var(--bd)}
.vrlist{}
.vrev{padding:20px 0;border-bottom:1px solid var(--sandl)}
a.vrev{display:block;color:inherit;text-decoration:none;cursor:pointer;
  padding:18px 16px;margin:0 -16px;border-radius:var(--r);
  transition:background var(--t)}
a.vrev:hover{background:var(--cream2)}
a.vrev:hover .vrev-more{color:var(--bd)}
.vrev-more{display:inline-block;margin-top:10px;font-size:.66rem;font-style:normal;
  letter-spacing:.12em;text-transform:uppercase;color:var(--txl);
  transition:color var(--t)}

.vrev-stars{color:var(--bm);font-size:.73rem;letter-spacing:3px;margin-bottom:5px}
.vrev-txt{font-size:.86rem;line-height:1.8;color:var(--txm);font-style:italic}
.vrev-link{display:inline-block;margin-top:9px;font-size:.7rem;font-style:normal;
  letter-spacing:.1em;text-transform:uppercase;color:var(--bm);
  border-bottom:1px solid var(--bm);padding-bottom:1px;transition:color var(--t),border-color var(--t)}
.vrev-link:hover{color:var(--bd);border-color:var(--bd)}

.vsidebar{position:sticky;top:calc(var(--nh) + 56px)}
.bwid{background:#fff;border:1px solid var(--sand);padding:24px 26px;margin-bottom:14px}
.bwid-p{font-family:var(--fs);font-size:2.1rem;color:var(--bd)}
.bwid-p small{font-family:var(--fb);font-size:.78rem;color:var(--txl)}
.bwid-tag{font-size:.73rem;color:var(--txl);line-height:1.5;margin-bottom:16px}

.bwid-cta{display:block;text-align:center;background:var(--bm);color:#fff;
  padding:14px 18px;font-size:.72rem;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;transition:background var(--t)}
.bwid-cta:hover{background:var(--bm-dk)}
.bwid-note{margin-top:11px;text-align:center;font-size:.68rem;color:var(--txl)}

.vmap-wrap{margin-top:18px}
.vmap{width:100%;height:280px;border:1px solid var(--sand);border-radius:var(--r);
  display:block;background:var(--cream2)}
.vmap-link{display:inline-block;margin-top:11px;font-size:.72rem;letter-spacing:.1em;
  color:var(--bm);border-bottom:1px solid var(--bm);padding-bottom:2px;
  transition:color var(--t),border-color var(--t)}
.vmap-link:hover{color:var(--bd);border-color:var(--bd)}

.ipanel{background:var(--sand);border:1px solid var(--sand);padding:18px;margin-bottom:14px}

let _interval=null, _slide=0;
window.go=function(r){window.location.hash=r;window.scrollTo(0,0)};

function render(){
  clearInterval(_interval);
  if(window._LB)window._LB.close();
  const hash=window.location.hash.replace('#','').trim();
  const app=document.getElementById('app');
  app.style.animation='none';
  void app.offsetHeight;
  app.style.animation='';
  if(!hash||hash==='home'){
    app.innerHTML=buildHome();
    startSlideshow();
    const heroEl=document.querySelector('.hero');
    const navH=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--nh'))||72;
    const updateNav=()=>navMode(window.scrollY<(heroEl?heroEl.offsetHeight:600)-navH);
    window.onscroll=updateNav;
    updateNav();
  } else if(hash.startsWith('villa/')){
    navMode(false);
    window.onscroll=null;
    app.innerHTML=buildVilla(hash.replace('villa/',''));
    initVillaSlideshow();
  } else if(hash==='about'){
    navMode(false);
    window.onscroll=null;
    app.innerHTML=buildAbout();
  }
}

function navMode(hero){
  const n=document.getElementById('nav');
  n.className=hero?'glass':'solid';
  navLight(hero);
}
function navLight(on){
  const n=document.getElementById('nav');
  if(on)n.classList.add('nav-light');
  else n.classList.remove('nav-light');
}

function startSlideshow(){
  const slides=document.querySelectorAll('.hslide');
  const dots=document.querySelectorAll('.hdot');
  if(!slides.length)return;
  _slide=0;
  slides[0].classList.add('on');
  if(dots.length)dots[0].classList.add('on');
  _interval=setInterval(()=>{
    slides[_slide].classList.remove('on');
    if(dots.length)dots[_slide].classList.remove('on');
    _slide=(_slide+1)%slides.length;
    slides[_slide].classList.add('on');
    if(dots.length)dots[_slide].classList.add('on');
  },5000);
}

window.goSlide=function(i){
  const slides=document.querySelectorAll('.hslide');
  const dots=document.querySelectorAll('.hdot');
  slides[_slide].classList.remove('on');
  if(dots.length)dots[_slide].classList.remove('on');
  _slide=i;
  slides[i].classList.add('on');
  if(dots.length)dots[i].classList.add('on');
  clearInterval(_interval);
  _interval=setInterval(()=>{
    slides[_slide].classList.remove('on');
    if(dots.length)dots[_slide].classList.remove('on');
    _slide=(_slide+1)%slides.length;
    slides[_slide].classList.add('on');
    if(dots.length)dots[_slide].classList.add('on');
  },5000);
};

function initVillaSlideshow(){
  const stage=document.querySelector('.vshow');
  if(!stage)return;
  const track=stage.querySelector('.vshow-stage');
  const dotsWrap=stage.querySelector('.vshow-dots');
  const curEl=stage.querySelector('.vshow-cur');
  const totEl=stage.querySelector('.vshow-total');
  const slides=()=>[...track.querySelectorAll('.vshow-slide')];
  const dots=()=>[...dotsWrap.querySelectorAll('.vshow-dot')];
  const thumbsWrap=stage.parentElement.querySelector('.vshow-thumbs');
  const thumbs=()=>thumbsWrap?[...thumbsWrap.querySelectorAll('.vthumb')]:[];
  let idx=0;

  const paint=()=>{
    const s=slides(),d=dots();
    if(!s.length)return;
    idx=((idx%s.length)+s.length)%s.length;
    s.forEach((el,n)=>el.classList.toggle('on',n===idx));
    d.forEach((el,n)=>el.classList.toggle('on',n===idx));
    const th=thumbs();
    th.forEach((el,n)=>el.classList.toggle('on',n===idx));
    if(th[idx]&&thumbsWrap){
      const tr=th[idx].getBoundingClientRect(),wr=thumbsWrap.getBoundingClientRect();
      thumbsWrap.scrollBy({left:(tr.left+tr.width/2)-(wr.left+wr.width/2),behavior:'smooth'});
    }
    if(curEl)curEl.textContent=idx+1;
    if(totEl)totEl.textContent=s.length;
    stage.classList.toggle('single',s.length<=1);
  };
  const go=i=>{idx=i;paint();};
  const next=()=>go(idx+1);
  const prev=()=>go(idx-1);

  const prune=img=>{
    const slide=img.closest('.vshow-slide');
    if(!slide)return;
    const pos=slides().indexOf(slide);
    const dot=dots()[pos];
    if(dot)dot.remove();
    const th=thumbs()[pos];
    if(th)th.remove();
    slide.remove();
    if(pos<idx)idx--;
    if(!slides().length){
      track.innerHTML=`<div class="vshow-slide on"><img src="${stage.dataset.fallback||''}" alt="Villa photo"></div>`;
      idx=0;
    }
    paint();
  };
  slides().forEach(s=>{
    const img=s.querySelector('img');
    if(!img)return;
    if(img.complete&&img.naturalWidth===0)prune(img);
    else img.addEventListener('error',()=>prune(img),{once:true});
  });

  ensureLightbox();
  const openLightbox=()=>{
    const items=slides().map(s=>{
      const im=s.querySelector('img');
      return{src:im.getAttribute('src'),alt:im.getAttribute('alt')||''};
    });
    window._LB.open(items,idx,i=>go(i));
  };

  stage.querySelector('.vshow-next').addEventListener('click',next);
  stage.querySelector('.vshow-prev').addEventListener('click',prev);
  dotsWrap.addEventListener('click',e=>{
    const d=e.target.closest('.vshow-dot');
    if(!d)return;
    go(dots().indexOf(d));
  });
  if(thumbsWrap)thumbsWrap.addEventListener('click',e=>{
    const t=e.target.closest('.vthumb');
    if(!t)return;
    go(thumbs().indexOf(t));
  });
  stage.addEventListener('keydown',e=>{
    if(document.querySelector('.vlb.open'))return;
    if(e.key==='ArrowRight'){next();e.preventDefault();}
    else if(e.key==='ArrowLeft'){prev();e.preventDefault();}
  });

  let swiped=false;
  track.addEventListener('click',()=>{if(!swiped)openLightbox();});

  let sx=null;
  track.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;swiped=false;},{passive:true});
  track.addEventListener('touchend',e=>{
    if(sx===null)return;
    const dx=e.changedTouches[0].clientX-sx;
    if(Math.abs(dx)>40){(dx<0?next:prev)();swiped=true;setTimeout(()=>{swiped=false;},350);}
    sx=null;
  },{passive:true});

  paint();
}

function ensureLightbox(){
  if(window._LB)return window._LB;
  const el=document.createElement('div');
  el.className='vlb';el.id='vlb';
  el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');
  el.setAttribute('aria-hidden','true');
  el.innerHTML=
    '<button type="button" class="vlb-close" aria-label="Close (Esc)">×</button>'+
    '<button type="button" class="vlb-arrow vlb-prev" aria-label="Previous photo">‹</button>'+
    '<button type="button" class="vlb-arrow vlb-next" aria-label="Next photo">›</button>'+
    '<figure class="vlb-fig"><img class="vlb-img" alt=""><figcaption class="vlb-cap"></figcaption></figure>';
  document.body.appendChild(el);
  const img=el.querySelector('.vlb-img');
  const cap=el.querySelector('.vlb-cap');
  const ctx={items:[],i:0,sync:null};
  const render=()=>{
    const it=ctx.items[ctx.i];if(!it)return;
    img.src=it.src;img.alt=it.alt||'';
    cap.textContent=ctx.items.length>1?(ctx.i+1)+' / '+ctx.items.length:'';
    el.classList.toggle('single',ctx.items.length<=1);
  };
  const open=(items,i,sync)=>{
    ctx.items=items||[];ctx.i=i||0;ctx.sync=sync||null;
    if(!ctx.items.length)return;
    render();
    el.classList.add('open');el.setAttribute('aria-hidden','false');
    document.body.style.overflow='hidden';
  };
  const close=()=>{
    el.classList.remove('open');el.setAttribute('aria-hidden','true');
    document.body.style.overflow='';img.src='';
  };
  const move=d=>{
    if(!ctx.items.length)return;
    ctx.i=(ctx.i+d+ctx.items.length)%ctx.items.length;
    render();if(ctx.sync)ctx.sync(ctx.i);
  };
  el.querySelector('.vlb-prev').addEventListener('click',()=>move(-1));
  el.querySelector('.vlb-next').addEventListener('click',()=>move(1));
  el.addEventListener('click',e=>{
    if(e.target.closest('.vlb-arrow')||e.target.closest('.vlb-img'))return;
    close();
  });
  document.addEventListener('keydown',e=>{
    if(!el.classList.contains('open'))return;
    if(e.key==='Escape')close();
    else if(e.key==='ArrowRight')move(1);
    else if(e.key==='ArrowLeft')move(-1);
  });
  window._LB={open,close};
  return window._LB;
}

  const rcards=reviews.map(r=>{

      <div class="rqs">"</div>

    return r.url

      <div class="hey">St. John, US Virgin Islands</div>
      <div class="htitle">Las Flores</div>

    <div class="hdots">${dots}</div>

  <div class="vsubnav">
    ${villaTabs}

  <div class="intro-grid">
    <img src="${IMG.intro}" alt="Las Flores villa" loading="lazy">
    <div>
      <span class="section-eyebrow intro-eybrow">Welcome to Las Flores</span>
      <h2>Las Flores</h2>
      <p>Every villa is chosen to deliver that blend of comfort and unforgettable views. From a private two-bedroom home with its own pool to a romantic one-bedroom cottage, our properties are designed for the way you want to vacation.</p>

        <span class="section-eyebrow">The Island</span>
        <h2>Discover St. John</h2>
        <p>St. John is the smallest and most enchanting of the US Virgin Island, a place where two-thirds of the island is a protected National Park.</p>
        <ul class="sj-list">
          <li>
            <div class="sj-icon">🏖</div>
            <div><span class="sj-li-t">World-Class Beaches</span><span class="sj-li-s">Trunk Bay, Oppenheimer Beach, and more — all within a short drive</span></div>
          </li>
          <li>
            <div class="sj-icon">🌿</div>
            <div><span class="sj-li-t">Virgin Islands National Park</span><span class="sj-li-s">14,737 acres of protected tropical forest, hiking trails, and pristine coral reefs</span></div>
          </li>
          <li>
            <div class="sj-icon">🌊</div>
            <div><span class="sj-li-t">Snorkeling</span><span class="sj-li-s">Crystal-clear Caribbean water with vibrant reefs teeming with marine life</span></div>
          </li>
          <li>
            <div class="sj-icon">🍽</div>
            <div><span class="sj-li-t">Dining</span><span class="sj-li-s">Cruz Bay's restaurants, bars, and spas are within walking distance</span></div>

      <div class="sj-img" style="display: flex; align-items: stretch; height: 100%;">

  <section class="offers-wrap">

          <div class="ocard-body">

function buildVilla(id){
  const v=VD[id];
  if(!v)return`<div style="padding:140px 40px;text-align:center"><h2 style="font-family:var(--fs);font-size:2rem;color:var(--bd)">Villa not found</h2><p style="margin-top:12px;color:var(--txl)"><span onclick="go('')" tabindex="0" role="link" style="cursor:pointer;text-decoration:underline">← Back to home</span></p></div>`;
  const imgs=IMG[id]||IMG.hawksbill;
  const listed=galleryPhotos(id);
  const gphotos=listed.length?listed:[imgs[0]];
  const slideH=gphotos.map((u,i)=>
    `<div class="vshow-slide${i===0?' on':''}"><img src="${u}" alt="${v.name} — photo ${i+1}"></div>`).join('');
  const dotH=gphotos.map((_,i)=>
    `<button type="button" class="vshow-dot${i===0?' on':''}" aria-label="Go to photo ${i+1}"></button>`).join('');
  const thumbH=gphotos.map((u,i)=>
    `<button type="button" class="vthumb${i===0?' on':''}" aria-label="View photo ${i+1}"><img src="${u}" alt="${v.name} — thumbnail ${i+1}" loading="lazy"></button>`).join('');
  const others=Object.entries(VD).filter(([k])=>k!==id);
  const amenH=v.amen.map(a=>`<div class="amen">${a}</div>`).join('');
  const distH=Object.entries(v.dist).map(([icon,raw])=>{
    const[name,val]=raw.split('|');
    return`<div class="dc"><div class="di">${icon}</div><div class="dn">${name}</div><div class="dv">${val}</div></div>`;
  }).join('');
  const bookingUrl='https://www.destinationstjohn.com/accommodation/'+id+'/';
  const geo=MAPS[id];
  const mapEmbed=geo
    ?`<iframe class="vmap" loading="lazy" title="Map showing ${v.name} on St. John, USVI" referrerpolicy="no-referrer-when-downgrade" src="https://maps.google.com/maps?q=${geo.lat},${geo.lng}&z=17&output=embed"></iframe>`
    :'';
  const mapUrl=geo
    ?`https://www.google.com/maps/place/${encodeURIComponent(v.name)}/@${geo.lat},${geo.lng},18z`
    :'https://www.google.com/maps/search/St.+John+USVI';
  const revH=v.reviews.length?v.reviews.slice(0,3).map(r=>`
    <a class="vrev" href="${bookingUrl}" target="_blank" rel="noopener" title="Read this review on Destination St. John">
      ${r.stars?`<div class="vrev-stars">${'★'.repeat(r.stars)}${'☆'.repeat(5-r.stars)}</div>`:''}
      <div class="vrev-txt">${r.txt}</div>
      <span class="vrev-more">View on Destination St. John ↗</span>
    </a>`).join(''):`<p style="font-size:.86rem;color:var(--txl);font-style:italic">No guest reviews yet.</p>`;
  const otherH=others.map(([k,ov])=>`
    <div class="ovi" onclick="go('villa/${k}')" tabindex="0" role="link" aria-label="View ${ov.name}">
      <img src="${IMG[k][0]}" alt="${ov.name}" loading="lazy">
      <div><div class="ovi-n">${ov.name}</div><div class="ovi-f"> ${ov.beds}BR</div></div>
    </div>`).join('');
  const tags=[`${v.beds} Bedroom${v.beds>1?'s':''}`,`${v.baths} Bathroom${v.baths>1?'s':''}`,`Up to ${v.guests} Guests`];
  const tagH=tags.map(t=>`<span class="vtag">${t}</span>`).join('');
  const otherTabs=others.map(([k,ov])=>`<div class="vsnt" onclick="go('villa/${k}')" tabindex="0" role="link">${ov.name}</div>`).join('');

  return`
  <div style="padding-top:var(--nh)">
    <div class="vhero">
      <img src="${imgs[0]}" alt="${v.name}">
      <div class="vhovl"></div>
      <div class="vhcont">
        <div class="vname">${v.name}</div>
        <div class="vtags">${tagH}</div>
      </div>
    </div>

    <div class="vsubnav">
      ${otherTabs}
      <div class="vsnt" onclick="go('')" tabindex="0" role="link">← Home</div>
    </div>

    <div class="vmain">
      <div class="v2col">

        <div>
          <div class="vshow" tabindex="0" aria-roledescription="carousel"
               aria-label="${v.name} photo gallery" data-fallback="${imgs[0]}"
               data-dir="${GALLERY_DIRS[id]||''}">
            <div class="vshow-stage">${slideH}</div>
            <button type="button" class="vshow-arrow vshow-prev" aria-label="Previous photo">‹</button>
            <button type="button" class="vshow-arrow vshow-next" aria-label="Next photo">›</button>
            <div class="vshow-counter"><span class="vshow-cur">1</span> / <span class="vshow-total">${gphotos.length}</span></div>
            <div class="vshow-dots">${dotH}</div>
          </div>
          <div class="vshow-thumbs" aria-label="Photo thumbnails">${thumbH}</div>

          <div class="vsec" id="vov">
            <h3>About ${v.name}</h3>
            <p class="vdesc">${v.desc}</p>
          </div>

          <div class="vsec" id="vam">
            <h3>Amenities</h3>
            <div class="amen-grid">${amenH}</div>
          </div>

          <div class="vsec" id="vloc">
            <h3>Location & Distances</h3>
            <p style="font-size:.86rem;color:var(--txl);margin-bottom:18px;line-height:1.85">Nestled in a quiet residential neighborhood on the hills above Cruz Bay, minutes from St. John's finest beaches, the National Park, dining, and shopping.</p>
            <div class="dist-row">${distH}</div>
            <div class="vmap-wrap">
              ${mapEmbed}
              <a class="vmap-link" href="${mapUrl}" target="_blank" rel="noopener">📍 Open ${v.name} in Google Maps ↗</a>
            </div>
          </div>

          <div class="vsec" id="vrev">
            <h3>Guest Reviews</h3>
            <div class="vrlist">${revH}</div>
            <div style="margin-top:22px">
              <a href="${bookingUrl}" target="_blank" rel="noopener" style="font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--bm);border-bottom:1px solid var(--bm);padding-bottom:2px">Read all reviews &amp; book on Destination St. John ↗</a>
            </div>
          </div>
        </div>

        <div class="vsidebar">
          <div class="bwid">
            <div class="bwid-tag">${v.tagline}</div>
            <a class="bwid-cta" href="${bookingUrl}" target="_blank" rel="noopener">Check Dates &amp; Book →</a>
            <div class="bwid-note">Secure booking on Destination St. John</div>
          </div>

          <div class="ipanel">
            <h4>Quick Facts</h4>
            <div class="irow"><span>Bedrooms</span><strong>${v.beds}</strong></div>
            <div class="irow"><span>Bathrooms</span><strong>${v.baths}</strong></div>
            <div class="irow"><span>Max Guests</span><strong>${v.guests}</strong></div>
          </div>

          <div class="ovillas">
            <h4>Other Villas</h4>
            ${otherH}
          </div>
        </div>

      </div>
    </div>
  </div>`;
}

function buildAbout(){
  const vbtns=Object.entries(VD).map(([id,v])=>`
    <button onclick="go('villa/${id}')"
      style="background:var(--bd);color:#fff;padding:12px 28px;
        font-family:var(--fb);font-size:.72rem;font-weight:500;
        letter-spacing:.12em;text-transform:uppercase;cursor:pointer;
        border:none;transition:background .3s ease"
      onmouseover="this.style.background='var(--bm)'"
      onmouseout="this.style.background='var(--bd)'">${v.name}</button>`).join('');
  return`
  <div>
    <div class="ahero">
      <h1>About Las Flores Villas</h1>
      <p>A family-owned collection of four villas on the hills of St. John.</p>
    </div>
    <div class="abody">
      <div class="ag">
        <div>
          <span class="section-eyebrow">The U.S. Virgin Islands</span>
          <h2 class="section-title" style="margin-top:12px;margin-bottom:16px">A Little History of St. John</h2>
          <p style="font-size:.91rem;line-height:1.95;color:var(--txm);margin-bottom:14px">The Danish West Indies were colonized and farmed for sugar through the 1600s and 1700s. They became American territories in 1917, when the U.S. bought them from Denmark for $25 million. St. John, the smallest and least developed of the three, still wears that history in the stone ruins of its old sugar estates.</p>
          <p style="font-size:.91rem;line-height:1.95;color:var(--txm)">In 1956, land donated largely by Laurance Rockefeller became Virgin Islands National Park, which now protects more than half the island — forests, trails, shoreline, and reefs. This has helped keep the island clean: no sprawling resorts, just green hills tumbling into turquoise bays. People come for the beaches, snorkeling, and the relaxed atmosphere. US citizens do not require a passport.</p>
        </div>
        <img src="home_photos/REPTILE.JPG" alt="St. John, US Virgin Islands" style="width:100%;aspect-ratio:4/3;object-fit:cover" loading="lazy">
      </div>

      <div style="text-align:center">
        <span class="section-eyebrow">Ready to Stay?</span>
        <h2 class="section-title" style="margin-top:12px;margin-bottom:26px">Choose Your Villa</h2>
        <div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap">${vbtns}</div>
      </div>
    </div>
  </div>`;
}

document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ')return;
  const el=e.target.closest('[role="link"][tabindex]');
  if(!el)return;
  e.preventDefault();
  el.click();
});

window.addEventListener('hashchange',render);
render();
</script>
</body>
</html>
